<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Sin conexión · Aurum</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080808;
        color: #f5f5f5;
        font-family: "Segoe UI", Inter, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { width: min(380px, 90vw); text-align: center; }
      .mark {
        width: 48px; height: 48px; margin: 0 auto;
        display: grid; place-items: center;
        background: #fac51c; color: #080808;
        border-radius: 12px; font-size: 20px; font-weight: 700;
      }
      h1 { margin: 20px 0 0; font-size: 19px; letter-spacing: -0.02em; }
      p { margin: 8px 0 0; font-size: 12.5px; line-height: 1.6; color: #8a8a8a; }
      button {
        margin-top: 24px; padding: 12px 22px; border: 0; border-radius: 10px;
        background: #fac51c; color: #080808;
        font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #ffd75e; }
      .hint { margin-top: 14px; font-size: 11px; color: #5a5a5a; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">A</div>
      <h1>Sin conexión</h1>
      <p>
        Aurum necesita internet para leer tus datos. Comprueba la conexión y
        vuelve a intentarlo.
      </p>
      <button onclick="location.href='https://crm-david-538.netlify.app'">
        Reintentar
      </button>
      <div class="hint">También puedes recargar con Ctrl+R</div>
    </div>
  </body>
</html>
