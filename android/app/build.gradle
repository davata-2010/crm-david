plugins {
  id 'com.android.application'
}

android {
  namespace 'agency.aurum.crm'
  compileSdk 34

  defaultConfig {
    applicationId "agency.aurum.crm"
    minSdk 23
    targetSdk 34
    versionCode 1
    versionName "1.0.0"
  }

  signingConfigs {
    release {
      storeFile file(project.hasProperty('storeFile') ? project.storeFile : 'aurum.keystore')
      storePassword project.hasProperty('storePassword') ? project.storePassword : ''
      keyAlias project.hasProperty('keyAlias') ? project.keyAlias : 'aurum'
      keyPassword project.hasProperty('keyPassword') ? project.keyPassword : ''
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }

  androidResources {
    // El patrón por defecto de aapt incluye `<dir>_*`, que se salta cualquier
    // carpeta que empiece por guión bajo. Next pone TODO su JavaScript y su
    // CSS en `_next/`, así que con el patrón por defecto el APK se quedaba con
    // los HTML y sin código: la aplicación abría en negro. Éste es el mismo
    // patrón menos esa regla.
    ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    noCompress 'woff2'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // Publica los ficheros de assets/ bajo un origen https real, que es lo que
  // necesita el almacenamiento local donde Supabase guarda la sesión.
  implementation 'androidx.webkit:webkit:1.12.1'
}
